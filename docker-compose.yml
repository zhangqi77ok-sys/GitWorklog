# 统一智能体平台一键启动：App + MySQL + Redis + PgVector + MinIO + mcp-echarts
# 用法：docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unified-agent-app
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      APP_PORT: "8010"
      # 平台主库

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: unified_agent
      # 缓存与会话
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 向量检索库
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: 5432
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: postgres
      PGVECTOR_DB: vectors
      # 对象存储
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      # MCP 扩展
      MCP_ECHARTS_URL: http://mcp-echarts:3033/mcp
      # 安全密钥
      AUTH_JWT_SECRET: unified-agent-production-jwt-secret-key-32-chars
      # 阿里百炼模型配置
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-qwen3.7-flash}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-qwen3.7-flash}
    env_file:
      - path: .env
        required: false

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio:
        condition: service_started
      mcp-echarts:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: unified-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: unified_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unified-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: unified-agent-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectors
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectors"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: unified-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data

  mcp-echarts:
    image: node:20-alpine
    container_name: unified-agent-mcp-echarts
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx -y mcp-echarts --port 3033"
    ports:
      - "3033:3033"

volumes:
  mysql_data:
  redis_data:
  pgvector_data:
  minio_data:
