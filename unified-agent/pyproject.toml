[project]
name = "unified-agent"
version = "0.1.0"
description = "统一智能体平台：融合 gogo 差旅多 Agent 与 dodo-agentx 数据分析（Python + AgentScope）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web / 接入层
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    # 配置 / 校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 认证
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # 持久化
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "redis>=5.1",
    # 向量 / RAG（PgVector）
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # 对象存储
    "minio>=7.2",
    # SQL AST（替代 jsqlparser，data 域安全/权限改写）
    "sqlglot>=25.0",
    # 文档解析
    "pymupdf>=1.24",
    # 日志
    "structlog>=24.4",
    # Agent 编排框架（LangGraph）+ 模型接入（OpenAI 兼容，接 DashScope/DeepSeek）
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    # HTTP 客户端（MCP / 外部 API）
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------- Ruff：lint + format ----------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplify, RUF ruff 专属
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E501 行长交给 formatter；RUF001/002/003 全角标点在中文注释中是正常的
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- Mypy：静态类型 ----------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true   # 第三方无 stub 时不报错
plugins = ["pydantic.mypy"]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
