<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>统一智能体平台</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <!-- 登录区 -->
    <section id="login-panel" class="panel">
      <h1>统一智能体平台</h1>
      <p class="sub">差旅多 Agent × 数据分析（Text2SQL）</p>
      <input id="username" placeholder="用户名" autocomplete="username" />
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
      <button id="login-btn">登录</button>
      <div id="login-error" class="error"></div>
    </section>

    <!-- 聊天区 -->
    <section id="chat-panel" class="panel hidden">
      <header>
        <span id="who"></span>
        <button id="logout-btn" class="ghost">退出</button>
      </header>
      <div id="messages"></div>
      <div class="composer">
        <input id="query" placeholder="问问数据或差旅…（如：统计各部门销售额 / 帮我订机票）" />
        <button id="send-btn">发送</button>
      </div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
