[package]
name = "codemind-hub"
version = "1.0.0"
description = "CodeMind-Hub Enterprise AI Agentic IDE"
authors = ["CodeMind Architecture Team"]
edition = "2021"

[lib]
name = "codemind_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
