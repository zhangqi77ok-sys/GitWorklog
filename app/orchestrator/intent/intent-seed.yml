# 意图识别种子语料（O-4）。改这里不用改代码。
#
# rules   —— L1 关键词/正则。keywords 是子串匹配，patterns 是正则（IGNORECASE）。
#            匹配按「特异度」择优：命中文本越长越具体，因此泛词（如「多少」）
#            不会盖过具体词（如「订机票」）。
# seeds   —— L2 向量匹配的种子例句，需 live embedding 才生效。
#
# 覆盖原则：中文里动宾常被插入修饰语（「订机票」→「订去上海的机票」），
# 所以凡是动宾结构都要配一条允许中间插字的正则，光靠关键词必漏。
#
# 可用 INTENT_SEED_PATH 环境变量指向自定义文件覆盖本表。

rules:
  - category: data_analysis
    keywords:
      - 统计
      - 报表
      - 销售额
      - 占比
      - 环比
      - 同比
      - 排名
      - 趋势
      - 数据分析
      - 明细
      - 汇总
    patterns:
      - '查.{0,8}数据'
      - '分析.{0,8}数据'
      - '各.{0,6}(部门|地区|月|季度|门店).*(总|数|额|量)'
      - '(有多少|共多少|一共多少).{0,10}(条|个|人|单|笔)'
      - '(最高|最低|最多|最少|前\d+|top\s*\d+).{0,8}(的|是)'

  - category: travel_booking
    keywords:
      - 订票
      - 订机票
      - 订酒店
      - 订火车
      - 预订
      - 出票
      - 改签
      - 退票
    patterns:
      # 动宾插入修饰语：订「去上海的」机票 / 定「一张」酒店
      - '(订|定|预订|预定).{0,12}(机票|车票|火车票|高铁|酒店|宾馆|房间)'
      - '(买|购).{0,10}(机票|车票|火车票|高铁票)'
      - '(帮|给).{0,6}(我|他|她).{0,10}(订|定|预订).{0,10}'
      # 问票价/房价也是订票场景的一部分，不该落到闲聊
      - '(机票|车票|火车票|高铁|酒店|宾馆|房间).{0,6}(多少钱|价格|票价|房价|贵不贵)'

  - category: travel_manage
    keywords:
      - 差旅单
      - 出差申请
      - 我的差旅
      - 取消差旅
      - 出差记录
    patterns:
      - '申请.{0,6}出差'
      - '出差.{0,6}(申请|审批)'
      - '(取消|撤销).{0,8}(差旅|出差|行程)'
      - '(查|看).{0,6}(我的)?.{0,4}(差旅|出差).{0,4}(单|记录|申请)'

  - category: travel_plan
    keywords:
      - 行程
      - 规划路线
      - 怎么安排
      - 行程安排
    patterns:
      - '(安排|规划|计划).{0,10}(行程|路线|出差|旅程)'
      - '(几号|什么时候).{0,8}(出发|回来|返程)'

  - category: travel_info
    keywords:
      - 差旅政策
      - 报销标准
      - 签证
      - 景点
      - 住宿标准
      - 城市指南
    patterns:
      - '(出差|差旅).{0,8}(规定|政策|标准|额度|上限)'
      - '(能|可以|允许).{0,8}(住|坐|乘).{0,10}(标准|舱|星级)'
      - '(出差|差旅|去|到).{0,6}(天气|气象|气温|温度)'
      - '(北京|上海|广州|深圳|杭州|成都|武汉|南京|西安|重庆).{0,4}(天气|气象|气温)'
      - '(.{2,10})?.{0,4}(机场|火车站|高铁站|商圈|交通指南)'



  - category: travel_reimburse
    keywords:
      - 报销
      - 发票
      - 报销单
      - 贴票
    patterns:
      - '(提交|申请|提报).{0,8}报销'
      - '(发票|票据).{0,8}(上传|识别|录入)'

# L2 向量种子（需 live embedding）
seeds:
  data_analysis:
    - 上个月各部门的销售额是多少
    - 帮我分析一下订单数据的趋势
    - 统计今年的用户增长情况
  travel_booking:
    - 帮我订一张去上海的机票
    - 预订下周三的酒店
    - 我要改签明天的高铁
  travel_manage:
    - 我要申请下周去北京出差
    - 查一下我的差旅单
    - 取消我上周提交的出差申请
  travel_plan:
    - 帮我安排一下这次出差的行程
    - 规划从北京到上海的路线
  travel_info:
    - 我的职级出差能住什么标准的酒店
    - 去日本出差需要办签证吗
  travel_reimburse:
    - 我要提交这次出差的报销
    - 帮我识别一下这张发票
