<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="tcodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B27"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#tcodeGrad)" filter="url(#shadow)"/>
  
  <!-- Tcode Stylized T & Code Chevrons -->
  <g fill="#FFFFFF">
    <!-- Top Bar of T -->
    <rect x="62" y="60" width="132" height="30" rx="6"/>
    <!-- Center Stem of T -->
    <rect x="113" y="90" width="30" height="106" rx="6"/>
    <!-- Left Angle Bracket < -->
    <path d="M 52 136 L 36 148 L 52 160" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Angle Bracket > -->
    <path d="M 204 136 L 220 148 L 204 160" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>