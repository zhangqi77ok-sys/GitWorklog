<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Tcode 动态模型网关、MCP 服务与 Agent Skill 交互原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F4EFEA; color: #1E1C1A; padding: 24px; font-size: 13px; }
    .container { max-width: 960px; margin: 0 auto; background: #FAF8F5; border: 1px solid #E6DFD5; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); overflow: hidden; }
    .header { padding: 16px 20px; background: #FAF8F5; border-bottom: 1px solid #E6DFD5; display: flex; align-items: center; justify-content: space-between; }
    .tabs { display: flex; border-bottom: 1px solid #E6DFD5; background: #FFF; padding: 0 16px; }
    .tab { padding: 12px 18px; border-bottom: 2px solid transparent; font-weight: bold; cursor: pointer; color: #6B665F; }
    .tab.active { border-color: #D96B27; color: #D96B27; }
    .content { padding: 20px; }
    .section { margin-bottom: 20px; background: #FFF; border: 1px solid #E6DFD5; border-radius: 12px; padding: 16px; }
    .section-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card { padding: 10px; border: 1px solid #E6DFD5; border-radius: 8px; background: #FFF; cursor: pointer; transition: all 0.15s; }
    .card:hover { border-color: #D96B27; background: #FAF8F5; }
    .card.selected { border-color: #D96B27; background: #FAF8F5; box-shadow: 0 0 0 2px rgba(217, 107, 39, 0.2); font-weight: bold; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-green { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
    .badge-orange { background: #FAF8F5; color: #D96B27; border: 1px solid #D96B27; font-family: monospace; }
    input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #E6DFD5; border-radius: 6px; font-size: 12px; outline: none; background: #FAF8F5; }
    input:focus, textarea:focus { border-color: #D96B27; }
    .btn { padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 12px; transition: all 0.15s; }
    .btn-primary { background: #D96B27; color: #FFF; }
    .btn-primary:hover { background: #BF5A1B; }
    .btn-outline { background: #FFF; border: 1px solid #E6DFD5; color: #3D3A36; }
    .btn-outline:hover { background: #FAF8F5; border-color: #D96B27; }
    .row { display: flex; gap: 10px; align-items: center; }
    .tag-box { font-family: monospace; background: #FAF8F5; padding: 8px; border: 1px solid #E6DFD5; border-radius: 6px; color: #6B665F; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="row">
        <div style="width:28px;height:28px;background:rgba(217,107,39,0.15);color:#D96B27;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;">⚡</div>
        <strong>Tcode 全局设置中心 (PRD 动态交互原型)</strong>
      </div>
      <span class="badge badge-green">已对齐 sub2api 与 MCP 标准</span>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="showTab('gateway', this)">AI 模型网关 (动态联动)</div>
      <div class="tab" onclick="showTab('mcp', this)">MCP 协议管理 (深层配置)</div>
      <div class="tab" onclick="showTab('skills', this)">SKILL 技能管理 (提示词引擎)</div>
    </div>

    <div class="content" id="tab-gateway">
      <div class="section">
        <div class="section-title">
          <span>1. 目标平台厂商 (Provider Platform)</span>
          <span style="font-size:11px;color:#8A847C;">共支持 8 家主流厂商与自建服务</span>
        </div>
        <div class="grid" id="platform-grid"></div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>2. 认证接入方式 (根据厂商动态计算)</span>
          <span class="badge badge-green" id="ingress-count-badge">当前厂商支持 5 种认证</span>
        </div>
        <div class="grid-3" id="ingress-grid"></div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>3. 凭据与服务端点 (随认证模式动态切换表单)</span>
          <span class="badge badge-orange" id="active-mode-badge">API_KEY</span>
        </div>
        <div id="credential-area"></div>
      </div>
    </div>

    <div class="content" id="tab-mcp" style="display:none;">
      <div class="section">
        <div class="section-title">
          <span>MCP Server 协议服务清单</span>
          <button class="btn btn-primary" onclick="alert('已唤起全功能 McpServerModal，可配置命令、参数与环境变量！')">+ 添加 MCP Server</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;" id="mcp-list"></div>
      </div>
    </div>

    <div class="content" id="tab-skills" style="display:none;">
      <div class="section">
        <div class="section-title">
          <span>Agent Skills 技能清单</span>
          <button class="btn btn-primary" onclick="alert('已唤起全功能 SkillModal，支持多行 Markdown 指令与预设模版套用！')">+ 添加技能 (Skill)</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;" id="skill-list"></div>
      </div>
    </div>
  </div>

  <script>
    const PLATFORMS = [
      { id: 'anthropic', name: 'Anthropic Claude', icon: '🌟', supported: ['api_key', 'cap', 'sub2', 'oauth', 'proxy'], rec: 'api_key', url: 'https://api.anthropic.com/v1' },
      { id: 'openai', name: 'OpenAI', icon: '⚡', supported: ['api_key', 'cap', 'sub2', 'oauth', 'proxy'], rec: 'api_key', url: 'https://api.openai.com/v1' },
      { id: 'gemini', name: 'Google Gemini', icon: '💎', supported: ['api_key', 'oauth', 'sub2', 'proxy'], rec: 'api_key', url: 'https://generativelanguage.googleapis.com/v1beta' },
      { id: 'deepseek', name: 'DeepSeek', icon: '🇨🇳', supported: ['api_key', 'sub2', 'proxy'], rec: 'api_key', url: 'https://api.deepseek.com/v1' },
      { id: 'siliconflow', name: 'SiliconFlow 硅基流动', icon: '🚀', supported: ['api_key', 'sub2', 'proxy'], rec: 'api_key', url: 'https://api.siliconflow.cn/v1' },
      { id: 'ollama', name: 'Ollama 本地模型', icon: '💻', supported: ['proxy', 'api_key'], rec: 'proxy', url: 'http://127.0.0.1:11434/v1' }
    ];

    const INGRESS_MODES = [
      { id: 'api_key', name: '标准 API Key', desc: '官方 sk-*** 密钥直连' },
      { id: 'sub2', name: 'Sub2 订阅导入', desc: 'sub2api 订阅链接与账号池' },
      { id: 'cap', name: 'Cap 凭据包导入', desc: 'Session Token / Cookie 凭据' },
      { id: 'oauth', name: 'OAuth 2.0 授权', desc: '官方授权登录换取凭据' },
      { id: 'proxy', name: '自建中转 / 代理', desc: '反代或 OneAPI / 本地 Ollama' }
    ];

    let currentPlat = PLATFORMS[0];
    let currentIngress = 'api_key';

    function renderPlatforms() {
      const grid = document.getElementById('platform-grid');
      grid.innerHTML = '';
      PLATFORMS.forEach(p => {
        const d = document.createElement('div');
        d.className = 'card' + (p.id === currentPlat.id ? ' selected' : '');
        d.innerHTML = `<div>${p.icon} ${p.name}</div>`;
        d.onclick = () => {
          currentPlat = p;
          if (!p.supported.includes(currentIngress)) currentIngress = p.rec;
          renderAll();
        };
        grid.appendChild(d);
      });
    }

    function renderIngress() {
      const grid = document.getElementById('ingress-grid');
      grid.innerHTML = '';
      const available = INGRESS_MODES.filter(m => currentPlat.supported.includes(m.id));
      document.getElementById('ingress-count-badge').innerText = `当前厂商支持 ${available.length} 种认证`;

      available.forEach(m => {
        const isRec = currentPlat.rec === m.id;
        const d = document.createElement('div');
        d.className = 'card' + (m.id === currentIngress ? ' selected' : '');
        d.innerHTML = `
          <div style="display:flex;justify-content:space-between;">
            <strong>${m.name}</strong>
            ${isRec ? '<span class="badge badge-green">推荐</span>' : ''}
          </div>
          <div style="font-size:11px;color:#8A847C;margin-top:4px;">${m.desc}</div>
        `;
        d.onclick = () => {
          currentIngress = m.id;
          renderAll();
        };
        grid.appendChild(d);
      });
    }

    function renderCredentials() {
      const area = document.getElementById('credential-area');
      document.getElementById('active-mode-badge').innerText = currentIngress.toUpperCase();
      let html = `<div style="margin-bottom:10px;"><label style="font-weight:bold;">服务端点 (Endpoint URL):</label><input value="${currentPlat.url}"></div>`;

      if (currentIngress === 'api_key') {
        html += `<div><label style="font-weight:bold;">API 密钥 (API Key: sk-...):</label><input type="password" value="sk-ant-api03-live-sample-key"></div>`;
      } else if (currentIngress === 'sub2') {
        html += `
          <div><label style="font-weight:bold;">Sub2 订阅链接 (Subscription URL):</label><input placeholder="https://sub2api.example.com/api/v1/sub?token=xxx"></div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#2E7D32;">
            <span>✓ 已启用多账号池自动轮询与熔断</span>
            <button class="btn btn-outline" style="color:#2E7D32;" onclick="alert('已成功同步 Sub2 账号池！')">⚡ 立即同步账号</button>
          </div>
        `;
      } else if (currentIngress === 'cap') {
        html += `
          <div><label style="font-weight:bold;">Cap 凭据包 / Session Token (JSON 或 Token 文本):</label>
          <textarea rows="4" style="font-family:monospace;">{"session_token": "eyJhbGciOi...", "refresh_token": "rt_..."}</textarea></div>
        `;
      } else if (currentIngress === 'oauth') {
        html += `
          <div class="row" style="margin-bottom:8px;">
            <div style="flex:1;"><label style="font-weight:bold;">Client ID:</label><input value="tcode_studio_oauth_app"></div>
            <div style="flex:1;"><label style="font-weight:bold;">Client Secret:</label><input type="password" value="secret_xxxx"></div>
          </div>
          <button class="btn btn-primary" onclick="alert('已调起系统默认浏览器进行官方 OAuth 授权！')">🔗 发起官方授权登录</button>
        `;
      } else if (currentIngress === 'proxy') {
        html += `<div><label style="font-weight:bold;">访问令牌 (本地 Ollama 留空即可):</label><input placeholder="Bearer Token (可选)"></div>`;
      }
      area.innerHTML = html;
    }

    function renderMcp() {
      const list = document.getElementById('mcp-list');
      const servers = [
        { name: 'PostgreSQL MCP', transport: 'stdio', cmd: 'npx -y @modelcontextprotocol/server-postgres postgresql://...', envs: 'DATABASE_URL=***' },
        { name: 'GitHub MCP', transport: 'stdio', cmd: 'npx -y @modelcontextprotocol/server-github', envs: 'GITHUB_PERSONAL_ACCESS_TOKEN=***' },
        { name: 'Remote Microservice MCP', transport: 'sse', cmd: 'http://localhost:8000/sse', envs: '未配置' }
      ];
      list.innerHTML = servers.map(s => `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong>${s.name}</strong> <span class="badge badge-orange">${s.transport}</span>
            <div class="tag-box">${s.cmd} · [${s.envs}]</div>
          </div>
          <div class="row">
            <button class="btn btn-outline" onclick="alert('已对 ${s.name} 执行连通性测试：🟢 探测到 3 个原生工具！')">探活测试</button>
            <button class="btn btn-outline" onclick="alert('已唤起 ${s.name} 编辑抽屉，可修改命令参数与环境变量！')">编辑</button>
          </div>
        </div>
      `).join('');
    }

    function renderSkills() {
      const list = document.getElementById('skill-list');
      const skills = [
        { name: '代码审查专家 (Thermo-Nuclear Review)', trigger: '/review', desc: '深度审查函数规模、圈复杂度与 Code Judo 降维', prompt: '你是一名严苛架构审查专家，请执行规模门禁、阿里规约与 Code Judo 降维审查。' },
        { name: 'TDD 红绿重构测试生成器', trigger: '/tdd', desc: '前置编写失败单元测试，严格践行 Red-Green-Refactor 工作流', prompt: '请严格遵循 TDD 规范，先编写失败断言测试，治理 Mock 边界。' }
      ];
      list.innerHTML = skills.map(sk => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><strong>${sk.name}</strong> <span class="badge badge-orange">${sk.trigger}</span></div>
            <button class="btn btn-outline" onclick="alert('已打开 ${sk.name} 多行 Markdown 系统提示词编辑器！')">编辑指令</button>
          </div>
          <div style="font-size:11px;color:#6B665F;margin-top:4px;">${sk.desc}</div>
          <div class="tag-box">${sk.prompt}</div>
        </div>
      `).join('');
    }

    function renderAll() {
      renderPlatforms();
      renderIngress();
      renderCredentials();
      renderMcp();
      renderSkills();
    }

    function showTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-gateway').style.display = tab === 'gateway' ? 'block' : 'none';
      document.getElementById('tab-mcp').style.display = tab === 'mcp' ? 'block' : 'none';
      document.getElementById('tab-skills').style.display = tab === 'skills' ? 'block' : 'none';
    }

    renderAll();
  </script>
</body>
</html>
